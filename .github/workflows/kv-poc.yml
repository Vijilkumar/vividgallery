
name: Azure Key Vault POC

on:
  workflow_dispatch:
  push:
    branches:
      - feature/azure_key

permissions:
  id-token: write
  contents: read

jobs:
  keyvault-test:
    runs-on: ubuntu-latest

    steps:
      - name: Verify GitHub OIDC subject
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken(
              'api://AzureADTokenExchange'
            );
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
      
            console.log('Issuer:', payload.iss);
            console.log('Subject:', payload.sub);
            console.log('Audience:', payload.aud);
            console.log('Repository:', payload.repository);
            console.log('Repository ID:', payload.repository_id);
            console.log('Owner ID:', payload.repository_owner_id);
      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Retrieve secret from Azure Key Vault
        shell: bash
        env:
          KEYVAULT_NAME: ${{ secrets.KEYVAULT_NAME }}
        run: |
          SECRET_VALUE=$(az keyvault secret show \
            --vault-name "$KEYVAULT_NAME" \
            --name "test123abc" \
            --query value \
            --output tsv) || exit 1

          if [ -z "$SECRET_VALUE" ]; then
            echo "Secret retrieval failed: empty value."
            exit 1
          fi

          echo "::add-mask::$SECRET_VALUE"
          echo "SUCCESS: Secret retrieved from Azure Key Vault."
